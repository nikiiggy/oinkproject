<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Web Portfolio - Oink Project</title>
    <meta name="description" content="Portofolio Website dan Desain Grafis oleh Oink Project.">
    <meta name="author" content="Oink Project">
    <meta name="robots" content="index, follow">

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #eae5e0;
            --container-bg: #f8f3ee;
            --card-white: #ffffff;
            --card-coral: #ff5d39;
            --card-yellow: #ffc425;
            --card-cyan: #05bbc0; 
            --card-green: #22c55e;
            --dark-card: #111827;
            
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #efe8e1;
            
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.08);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
        }

        @media (min-width: 481px) {
            body { padding: 20px 0; }
        }

        /* Container Mobile-Based */
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--container-bg);
            min-height: 100vh;
            position: relative;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 14px;
        }

        @media (min-width: 481px) {
            .container {
                border-radius: var(--radius-lg);
                min-height: auto;
                border: 2px solid #e2dad1;
            }
        }

        /* Top Bar Navigation & Tombol Kembali */
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--card-white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
        }

        .btn-back-home {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f1f5f9;
            color: var(--text-main);
            text-decoration: none;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 800;
            border: 1px solid #e2e8f0;
            transition: var(--transition);
        }

        .btn-back-home:hover {
            background: var(--card-cyan);
            color: #ffffff;
            border-color: var(--card-cyan);
        }

        .brand-logo-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
        }

        .brand-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-name {
            font-size: 0.95rem;
            font-weight: 800;
        }

        .btn-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-icon:hover { border-color: var(--card-cyan); color: var(--card-cyan); }

        /* Fitur Search Input */
        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .search-input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            background: var(--card-white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            outline: none;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--card-cyan);
            box-shadow: 0 0 0 3px rgba(5, 187, 192, 0.15);
        }

        /* Filter Kategori Horizontal Scroll */
        .categories-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .categories-scroll::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: var(--card-white);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition);
        }

        .cat-btn.active {
            background: var(--card-cyan);
            color: #ffffff;
            border-color: var(--card-cyan);
            box-shadow: 0 4px 10px rgba(5, 187, 192, 0.3);
        }

        /* GALERI 2 GRID PORTRAIT MOBILE */
        .gallery-2grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .portfolio-card {
            background: var(--card-white);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .portfolio-card:hover {
            transform: translateY(-2px);
            border-color: var(--card-cyan);
        }

        .card-img-wrapper {
            position: relative;
            aspect-ratio: 3 / 4;
            width: 100%;
            background: #e2e8f0;
            overflow: hidden;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-tag-badge {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(17, 24, 39, 0.82);
            backdrop-filter: blur(4px);
            color: #ffffff;
            font-size: 0.62rem;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 6px;
            z-index: 2;
        }

        .card-info {
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-subtitle {
            font-size: 0.7rem;
            color: var(--card-cyan);
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-desc {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* State Kosong */
        .empty-state {
            grid-column: span 2;
            text-align: center;
            padding: 40px 16px;
            background: var(--card-white);
            border-radius: var(--radius-md);
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 700;
        }

        .empty-state i {
            font-size: 2rem;
            color: var(--card-cyan);
            margin-bottom: 8px;
            display: block;
        }

        /* Lightbox Preview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(17, 24, 39, 0.92);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            padding: 16px;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-content {
            width: 100%;
            max-width: 420px;
            background: var(--card-white);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            position: relative;
            max-height: 90vh;
        }

        .modal-media-container {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .modal-media-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .modal-thumbs {
            position: absolute;
            bottom: 0;
            left: 0;
            display: flex;
            gap: 6px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.6);
            width: 100%;
            justify-content: center;
            overflow-x: auto;
        }

        .thumb-item {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
            cursor: pointer;
            opacity: 0.6;
            border: 2px solid transparent;
            flex-shrink: 0;
        }

        .thumb-item.active { opacity: 1; border-color: var(--card-cyan); }

        .modal-details {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .modal-close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(17, 24, 39, 0.75);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            z-index: 10;
        }

        .btn-action-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-order-wa {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: #25d366;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.88rem;
            border-radius: var(--radius-sm);
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-order-wa:hover {
            background: #1eb856;
        }

        .btn-demo-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 11px;
            background: #0284c7;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.85rem;
            border-radius: var(--radius-sm);
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-demo-link:hover {
            background: #0369a1;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--dark-card);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.78rem;
            font-weight: 700;
            transition: var(--transition);
            z-index: 2000;
            opacity: 0;
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Toast Notification -->
        <div id="toast" class="toast">Link portofolio berhasil disalin!</div>

        <!-- Top Navigation Bar -->
        <header class="nav-bar">
            <!-- Tombol Kembali ke Home -->
            <a href="https://oinkproject.my.id/" class="btn-back-home" title="Kembali ke Halaman Utama">
                <i class="fas fa-arrow-left"></i>
                <span>Home</span>
            </a>

            <a href="#" class="brand-logo-nav">
                <div class="brand-icon">
                    <img src="https://i.ibb.co.com/QFDVtrm8/FASILITAS-TOKO-01-20.webp" alt="Oink Project Logo">
                </div>
                <span class="brand-name">Portfolio</span>
            </a>

            <button class="btn-icon" onclick="copyCurrentCategoryLink()" title="Bagikan Link">
                <i class="fas fa-share-nodes"></i>
            </button>
        </header>

        <!-- Fitur Search Bar -->
        <div class="search-box">
            <i class="fas fa-magnifying-glass"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Cari karya (website, landing page...)" oninput="handleSearch()">
        </div>

        <!-- Filter Kategori Horizontal -->
        <div class="categories-scroll" id="categoriesContainer">
            <button class="cat-btn active" onclick="filterGallery('Semua', this)">Semua</button>
        </div>

        <!-- GALERI 2 GRID PORTRAIT -->
        <main class="gallery-2grid" id="galleryGrid">
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Memuat portofolio...</p>
            </div>
        </main>
    </div>

    <!-- Modal Lightbox Preview -->
    <div class="modal-overlay" id="imageModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
            <div class="modal-media-container" id="modalMediaContainer">
                <!-- Preview Foto -->
            </div>
            <div class="modal-details">
                <div>
                    <span id="modalTag" class="card-tag-badge" style="position: relative; top: 0; left: 0; display: inline-block; margin-bottom: 6px;">Website</span>
                    <h2 id="modalTitle" class="card-title" style="font-size: 1.1rem; margin-bottom: 4px;">Judul Project</h2>
                    <p id="modalSubTitle" class="card-subtitle" style="font-size: 0.85rem; margin-bottom: 6px;">Sub Judul</p>
                    <p id="modalDesc" class="card-desc" style="font-size: 0.78rem; white-space: normal; line-height: 1.4; color: var(--text-main);">Deskripsi Project</p>
                </div>
                
                <div class="btn-action-group">
                    <!-- Tombol 1: Link Demo -->
                    <a id="modalDemoBtn" href="#" target="_blank" class="btn-demo-link" style="display: none;">
                        <i class="fas fa-external-link-alt"></i>
                        <span>Lihat Demo Website</span>
                    </a>
                    <!-- Tombol 2: Chat WhatsApp -->
                    <a id="modalWaBtn" href="#" target="_blank" class="btn-order-wa">
                        <i class="fab fa-whatsapp"></i>
                        <span>Pesan Website Seperti Ini</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRxJzVJoMeSTfyJ2erOm2dwf-6xAWJLD_a5s-zAvGmaJ33bOny1xYffztVPoVLhsB6PTn_-Nn2Y-Zy_/pub?gid=0&single=true&output=csv';
        const WHATSAPP_NUMBER = '6285155091238';

        let portfolioItems = [];
        let currentActiveCategory = "Semua";

        function parseCSV(str) {
            const arr = [];
            let quote = false, col = '', row = [];
            for (let i = 0; i < str.length; i++) {
                let cc = str[i], nc = str[i+1];
                if (cc === '"') {
                    if (quote && nc === '"') { col += '"'; i++; }
                    else { quote = !quote; }
                } else if (cc === ',' && !quote) {
                    row.push(col.trim()); col = '';
                } else if ((cc === '\r' || cc === '\n') && !quote) {
                    if (cc === '\r' && nc === '\n') { i++; }
                    row.push(col.trim());
                    if (row.length > 1 || row[0] !== '') arr.push(row);
                    row = []; col = '';
                } else { col += cc; }
            }
            if (col || row.length) { row.push(col.trim()); arr.push(row); }
            return arr;
        }

        async function loadSheetData() {
            try {
                const response = await fetch(GOOGLE_SHEET_CSV_URL);
                const csvText = await response.text();
                const rows = parseCSV(csvText);

                if (rows.length < 2) {
                    renderEmpty("Data portofolio kosong.");
                    return;
                }

                const headers = rows[0].map(h => h.toLowerCase().trim());
                
                // Pemetaan Kolom CSV Baru
                const idxJudul = headers.findIndex(h => h === 'judul');
                const idxSubJudul = headers.findIndex(h => h === 'sub judul' || h === 'subjudul');
                const idxKategori = headers.findIndex(h => h === 'kategori' || h === 'category');
                const idxDeskripsi = headers.findIndex(h => h === 'deskripsi' || h === 'desc');
                const idxFoto = headers.findIndex(h => h === 'foto' || h === 'gambar' || h === 'image');
                const idxLinkDemo = headers.findIndex(h => h === 'link demo' || h === 'demo' || h === 'link');

                portfolioItems = rows.slice(1).map((row, index) => {
                    const judul = (idxJudul !== -1 && row[idxJudul]) ? row[idxJudul] : 'Project Website';
                    const subJudul = (idxSubJudul !== -1 && row[idxSubJudul]) ? row[idxSubJudul] : '';
                    const kategori = (idxKategori !== -1 && row[idxKategori]) ? row[idxKategori] : 'Website';
                    const deskripsi = (idxDeskripsi !== -1 && row[idxDeskripsi]) ? row[idxDeskripsi] : '';
                    
                    let rawFoto = (idxFoto !== -1 && row[idxFoto]) ? row[idxFoto] : '';
                    let photos = rawFoto.split(',').map(img => img.trim()).filter(img => img.length > 0);
                    if (photos.length === 0) {
                        photos = ['https://via.placeholder.com/600x800?text=No+Image'];
                    }

                    let linkDemo = (idxLinkDemo !== -1 && row[idxLinkDemo]) ? row[idxLinkDemo].trim() : '';
                    if (linkDemo && !linkDemo.startsWith('http://') && !linkDemo.startsWith('https://')) {
                        linkDemo = 'https://' + linkDemo;
                    }

                    return {
                        id: index,
                        judul: judul,
                        subJudul: subJudul,
                        kategori: kategori,
                        deskripsi: deskripsi,
                        photos: photos,
                        mainPhoto: photos[0],
                        linkDemo: linkDemo
                    };
                });

                renderCategories();
                renderGallery(portfolioItems);

            } catch (error) {
                console.error("Gagal memuat data Google Sheet:", error);
                renderEmpty("Gagal memuat data portofolio. Pastikan Google Sheet dipublikasikan ke web.");
            }
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            const categories = [...new Set(portfolioItems.map(item => item.kategori).filter(Boolean))];
            
            let html = `<button class="cat-btn active" onclick="filterGallery('Semua', this)">Semua</button>`;
            categories.forEach(cat => {
                html += `<button class="cat-btn" onclick="filterGallery('${cat}', this)">${cat}</button>`;
            });
            container.innerHTML = html;
        }

        function renderGallery(items) {
            const grid = document.getElementById('galleryGrid');
            if (items.length === 0) {
                renderEmpty("Tidak ada portofolio yang cocok.");
                return;
            }

            let html = '';
            items.forEach(item => {
                html += `
                    <div class="portfolio-card" onclick="openModal(${item.id})">
                        <div class="card-img-wrapper">
                            <span class="card-tag-badge">${item.kategori}</span>
                            <img src="${item.mainPhoto}" alt="${item.judul}" loading="lazy" onerror="this.src='https://via.placeholder.com/600x800?text=Image+Error'">
                        </div>
                        <div class="card-info">
                            <h3 class="card-title">${item.judul}</h3>
                            ${item.subJudul ? `<p class="card-subtitle">${item.subJudul}</p>` : ''}
                            <p class="card-desc">${item.deskripsi || '-'}</p>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function renderEmpty(msg) {
            document.getElementById('galleryGrid').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-folder-open"></i>
                    <p>${msg}</p>
                </div>
            `;
        }

        function filterGallery(category, btn) {
            currentActiveCategory = category;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            const query = document.getElementById('searchInput').value.toLowerCase();
            applyFilterAndSearch(category, query);
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            applyFilterAndSearch(currentActiveCategory, query);
        }

        function applyFilterAndSearch(category, query) {
            const filtered = portfolioItems.filter(item => {
                const matchCat = category === "Semua" || item.kategori === category;
                const matchQuery = item.judul.toLowerCase().includes(query) || 
                                   item.subJudul.toLowerCase().includes(query) || 
                                   item.kategori.toLowerCase().includes(query) || 
                                   item.deskripsi.toLowerCase().includes(query);
                return matchCat && matchQuery;
            });
            renderGallery(filtered);
        }

        function openModal(id) {
            const item = portfolioItems.find(p => p.id === id);
            if (!item) return;

            const mediaContainer = document.getElementById('modalMediaContainer');
            const tag = document.getElementById('modalTag');
            const title = document.getElementById('modalTitle');
            const subTitle = document.getElementById('modalSubTitle');
            const desc = document.getElementById('modalDesc');
            const waBtn = document.getElementById('modalWaBtn');
            const demoBtn = document.getElementById('modalDemoBtn');

            tag.innerText = item.kategori;
            title.innerText = item.judul;
            
            if (item.subJudul) {
                subTitle.innerText = item.subJudul;
                subTitle.style.display = 'block';
            } else {
                subTitle.style.display = 'none';
            }

            desc.innerText = item.deskripsi || '-';

            // Preview Gambar & Galeri Thumbnail
            let mediaHtml = `<img id="mainModalImg" src="${item.photos[0]}" alt="${item.judul}">`;
            
            if (item.photos.length > 1) {
                mediaHtml += `<div class="modal-thumbs">`;
                item.photos.forEach((photo, idx) => {
                    mediaHtml += `<img src="${photo}" class="thumb-item ${idx === 0 ? 'active' : ''}" onclick="switchModalImage('${photo}', this)">`;
                });
                mediaHtml += `</div>`;
            }
            
            mediaContainer.innerHTML = mediaHtml;

            // Tombol 1: Link Demo
            if (item.linkDemo && item.linkDemo.length > 5) {
                demoBtn.href = item.linkDemo;
                demoBtn.style.display = 'flex';
            } else {
                demoBtn.style.display = 'none';
            }

            // Tombol 2: Chat WhatsApp
            const waText = encodeURIComponent(`Halo, saya tertarik pesan website seperti: ${item.judul}`);
            waBtn.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${waText}`;

            document.getElementById('imageModal').classList.add('active');
        }

        function switchModalImage(src, thumbEl) {
            const mainImg = document.getElementById('mainModalImg');
            if (mainImg) mainImg.src = src;
            document.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active'));
            if (thumbEl) thumbEl.classList.add('active');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        function copyCurrentCategoryLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast("Link portofolio berhasil disalin!");
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        document.addEventListener('DOMContentLoaded', loadSheetData);
    </script>
</body>
</html>
