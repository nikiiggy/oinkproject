<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Calendar Task Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8 font-sans antialiased selection:bg-indigo-100 selection:text-indigo-900">
  
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Top Header -->
    <header class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-600 font-bold text-lg shadow-sm">
            📅
          </div>
          <div>
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">Google Calendar Kanban Tracker</h1>
            <p class="text-xs sm:text-sm text-slate-500 font-normal">Sinkronisasi langsung dari Google Calendar • Urut deadline terdekat</p>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <!-- Live Clock & Status -->
        <div class="bg-slate-50 border border-slate-200/80 rounded-xl px-3.5 py-2 flex items-center gap-3">
          <div class="text-right">
            <div id="liveClock" class="font-mono font-bold text-slate-900 text-sm tracking-tight leading-none">00:00:00 WIB</div>
            <div id="liveDate" class="text-[11px] text-slate-500 font-medium mt-1 leading-none">Memuat tanggal...</div>
          </div>
          <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-blue-50 text-blue-700 border border-blue-200">
            <span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span>
            G-Calendar
          </span>
        </div>

        <!-- Tombol Refresh Data -->
        <button onclick="fetchCalendarEvents()" class="inline-flex items-center gap-2 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-semibold px-3.5 py-2.5 rounded-xl text-xs sm:text-sm shadow-sm transition active:scale-95" title="Muat ulang dari Google Calendar">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span id="refreshBtnText">Refresh</span>
        </button>

        <!-- Tombol Buka Google Calendar Langsung -->
        <a href="https://calendar.google.com" target="_blank" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2.5 rounded-xl text-xs sm:text-sm shadow-sm transition active:scale-95">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          Buka G-Calendar
        </a>
      </div>
    </header>

    <!-- Calendar View (7 Kolom Akurat) -->
    <section id="calendarSection" class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80 transition-all">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <div class="flex items-center gap-3">
          <h2 id="calendarMonthYear" class="text-base sm:text-lg font-bold text-slate-900 capitalize">Bulan Tahun</h2>
          <span id="calendarFilterIndicator" class="hidden text-xs bg-indigo-50 text-indigo-700 font-semibold px-2.5 py-1 rounded-full border border-indigo-200 items-center gap-1.5">
            Filter: <span id="selectedDateLabel"></span>
            <button onclick="clearDateFilter()" class="hover:text-indigo-950 font-bold ml-1">✕</button>
          </span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="prevMonth()" class="p-2 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-600 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          </button>
          <button onclick="goToToday()" class="px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-xs font-semibold text-slate-700 transition">Hari Ini</button>
          <button onclick="nextMonth()" class="p-2 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-600 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>

      <div class="overflow-x-auto">
        <div class="min-w-[560px]">
          <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wider">
            <div>Sen</div>
            <div>Sel</div>
            <div>Rab</div>
            <div>Kam</div>
            <div>Jum</div>
            <div>Sab</div>
            <div class="text-rose-500 font-bold">Min</div>
          </div>
          <div id="calendarGrid" class="grid grid-cols-7 gap-2"></div>
        </div>
      </div>
    </section>

    <!-- Kanban Board 3 Kolom -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
      
      <!-- Kolom To Do -->
      <div class="bg-slate-100/70 border border-slate-200/80 rounded-2xl p-4 flex flex-col">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-200">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
            <h3 class="font-bold text-sm text-slate-800">Antrean (To Do)</h3>
          </div>
          <span id="count-todo" class="text-xs font-semibold bg-white text-slate-600 px-2 py-0.5 rounded-md border border-slate-200 font-mono">0</span>
        </div>
        <div id="col-todo" class="space-y-3 flex-1 min-h-[160px]"></div>
      </div>

      <!-- Kolom In Progress -->
      <div class="bg-indigo-50/40 border border-indigo-100 rounded-2xl p-4 flex flex-col">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-indigo-100">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
            <h3 class="font-bold text-sm text-slate-800">Sedang Dikerjakan</h3>
          </div>
          <span id="count-progress" class="text-xs font-semibold bg-white text-indigo-700 px-2 py-0.5 rounded-md border border-indigo-200 font-mono">0</span>
        </div>
        <div id="col-progress" class="space-y-3 flex-1 min-h-[160px]"></div>
      </div>

      <!-- Kolom Done -->
      <div class="bg-emerald-50/30 border border-emerald-100 rounded-2xl p-4 flex flex-col">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-emerald-100">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
            <h3 class="font-bold text-sm text-slate-800">Selesai (Done)</h3>
          </div>
          <span id="count-done" class="text-xs font-semibold bg-white text-emerald-700 px-2 py-0.5 rounded-md border border-emerald-200 font-mono">0</span>
        </div>
        <div id="col-done" class="space-y-3 flex-1 min-h-[160px]"></div>
      </div>

    </div>

  </div>

  <script>
    // =========================================================================
    // 🔴 GANTI DENGAN URL GOOGLE APPS SCRIPT WEB APP MILIKMU DI BAWAH INI 🔴
    // =========================================================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyq_ABBAZ7w0XivaPhbW08-A2_NfOXGMCFOXyTJyzwjHlYN6wtfMaQxoPVI_p4s5J751g/exec";

    let allTasks = [];
    let selectedFilterDate = null;
    let calendarDate = new Date();

    async function fetchCalendarEvents() {
      const refreshBtn = document.getElementById('refreshBtnText');
      refreshBtn.textContent = 'Memuat...';

      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        allTasks = data;
        renderAll();
      } catch (err) {
        console.error("Gagal mengambil event:", err);
      } finally {
        refreshBtn.textContent = 'Refresh';
      }
    }

    function renderAll() {
      renderKanban();
      renderCalendar();
    }

    function renderKanban() {
      const colTodo = document.getElementById('col-todo');
      const colProgress = document.getElementById('col-progress');
      const colDone = document.getElementById('col-done');

      colTodo.innerHTML = '';
      colProgress.innerHTML = '';
      colDone.innerHTML = '';

      let filtered = allTasks;
      if (selectedFilterDate) {
        filtered = filtered.filter(t => t.deadlineDate === selectedFilterDate);
      }

      // Selalu urutkan yang paling mepet tanggal di atas
      filtered.sort((a, b) => a.deadline - b.deadline);

      let countTodo = 0, countProgress = 0, countDone = 0;
      const now = Date.now();

      filtered.forEach(task => {
        const card = createCardElement(task, now);
        if (task.status === 'progress') {
          colProgress.appendChild(card);
          countProgress++;
        } else if (task.status === 'done') {
          colDone.appendChild(card);
          countDone++;
        } else {
          colTodo.appendChild(card);
          countTodo++;
        }
      });

      document.getElementById('count-todo').textContent = countTodo;
      document.getElementById('count-progress').textContent = countProgress;
      document.getElementById('count-done').textContent = countDone;

      checkEmpty(colTodo, "Tidak ada jadwal");
      checkEmpty(colProgress, "Belum ada yang dikerjakan");
      checkEmpty(colDone, "Belum ada yang selesai");
    }

    function checkEmpty(col, msg) {
      if (col.children.length === 0) {
        col.innerHTML = `
          <div class="h-32 rounded-xl border border-dashed border-slate-200/90 flex items-center justify-center text-xs text-slate-400 bg-white/40 font-medium">
            ${msg}
          </div>`;
      }
    }

    function createCardElement(task, now) {
      const diffHours = (task.deadline - now) / (1000 * 60 * 60);
      let badgeHtml = '';

      if (task.status === 'done') {
        badgeHtml = `<span class="text-[11px] font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200">Selesai</span>`;
      } else if (diffHours < 0) {
        badgeHtml = `<span class="text-[11px] font-semibold text-rose-700 bg-rose-50 px-2 py-0.5 rounded-md border border-rose-200 animate-pulse">Lewat!</span>`;
      } else if (diffHours <= 24) {
        const hrs = Math.ceil(diffHours);
        badgeHtml = `<span class="text-[11px] font-semibold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200">Mepet! (${hrs}j lagi)</span>`;
      } else {
        const days = Math.ceil(diffHours / 24);
        badgeHtml = `<span class="text-[11px] font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md border border-slate-200">${days} hari lagi</span>`;
      }

      const priorityColors = {
        'Tinggi': 'bg-rose-50 text-rose-700 border-rose-200',
        'Sedang': 'bg-blue-50 text-blue-700 border-blue-200',
        'Rendah': 'bg-emerald-50 text-emerald-700 border-emerald-200'
      };

      const card = document.createElement('div');
      card.className = "bg-white p-4 rounded-xl border border-slate-200/80 shadow-sm hover:shadow transition-all space-y-2.5";
      card.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${priorityColors[task.priority] || priorityColors['Sedang']} uppercase tracking-wider">
            ${task.priority || 'Sedang'}
          </span>
          ${badgeHtml}
        </div>

        <h4 class="font-bold text-slate-800 text-sm leading-snug break-words ${task.status === 'done' ? 'line-through text-slate-400 font-normal' : ''}">
          ${escapeHtml(task.title)}
        </h4>

        <div class="flex items-center justify-between text-xs text-slate-500 pt-1 border-t border-slate-100">
          <span class="font-mono text-[11px] text-slate-600 font-medium">📅 ${task.deadlineDate} • ${task.deadlineTime}</span>
          <span class="bg-slate-50 border border-slate-200 px-1.5 py-0.5 rounded text-[11px] text-slate-600 font-medium truncate max-w-[120px]">${escapeHtml(task.tag || 'G-Cal')}</span>
        </div>
      `;
      return card;
    }

    function renderCalendar() {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      const monthNames = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
      document.getElementById('calendarMonthYear').textContent = `${monthNames[month]} ${year}`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const firstDayOfMonth = new Date(year, month, 1);
      const lastDayOfMonth = new Date(year, month + 1, 0);
      
      let startingDay = firstDayOfMonth.getDay() - 1;
      if (startingDay === -1) startingDay = 6;

      const totalDays = lastDayOfMonth.getDate();
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      for (let i = 0; i < startingDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = "min-h-[52px] sm:min-h-[64px] rounded-lg bg-slate-50/50 border border-slate-100";
        grid.appendChild(emptyCell);
      }

      for (let day = 1; day <= totalDays; day++) {
        const thisDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = thisDateStr === todayStr;
        const isSelected = thisDateStr === selectedFilterDate;

        const dayTasks = allTasks.filter(t => t.deadlineDate === thisDateStr);
        const hasTodo = dayTasks.some(t => t.status === 'todo');
        const hasProgress = dayTasks.some(t => t.status === 'progress');
        const hasDone = dayTasks.some(t => t.status === 'done');

        const dayCell = document.createElement('div');
        dayCell.onclick = () => filterByDate(thisDateStr);
        dayCell.className = `min-h-[52px] sm:min-h-[64px] p-2 rounded-xl border transition cursor-pointer flex flex-col justify-between ${
          isSelected 
            ? 'bg-blue-50 border-blue-400 ring-2 ring-blue-200' 
            : isToday 
              ? 'bg-white border-blue-500 ring-2 ring-blue-200 shadow-sm' 
              : 'bg-white border-slate-200/90 hover:border-slate-300'
        }`;

        dayCell.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold ${isToday ? 'text-blue-600 font-bold' : 'text-slate-700'}">${day}</span>
            ${dayTasks.length > 0 ? `<span class="text-[10px] font-bold font-mono text-slate-500">${dayTasks.length}</span>` : ''}
          </div>
          <div class="flex items-center gap-1 mt-1">
            ${hasTodo ? '<span class="w-1.5 h-1.5 rounded-full bg-rose-500" title="To Do"></span>' : ''}
            ${hasProgress ? '<span class="w-1.5 h-1.5 rounded-full bg-indigo-500" title="In Progress"></span>' : ''}
            ${hasDone ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500" title="Selesai"></span>' : ''}
          </div>
        `;

        grid.appendChild(dayCell);
      }
    }

    function filterByDate(dateStr) {
      if (selectedFilterDate === dateStr) {
        clearDateFilter();
      } else {
        selectedFilterDate = dateStr;
        document.getElementById('calendarFilterIndicator').classList.remove('hidden');
        document.getElementById('calendarFilterIndicator').classList.add('inline-flex');
        document.getElementById('selectedDateLabel').textContent = dateStr;
        renderKanban();
      }
    }

    function clearDateFilter() {
      selectedFilterDate = null;
      document.getElementById('calendarFilterIndicator').classList.add('hidden');
      document.getElementById('calendarFilterIndicator').classList.remove('inline-flex');
      renderKanban();
    }

    function prevMonth() {
      calendarDate.setMonth(calendarDate.getMonth() - 1);
      renderCalendar();
    }

    function nextMonth() {
      calendarDate.setMonth(calendarDate.getMonth() + 1);
      renderCalendar();
    }

    function goToToday() {
      calendarDate = new Date();
      renderCalendar();
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    // Jam Realtime
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('liveClock').textContent = `${hours}:${minutes}:${seconds} WIB`;

      const options = { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' };
      document.getElementById('liveDate').textContent = now.toLocaleDateString('id-ID', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Jalankan pertama kali
    fetchCalendarEvents();
  </script>
</body>
</html>
